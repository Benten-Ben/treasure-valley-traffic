#
# GDAL's OSM driver settings for mask v0 (basemap/ground/mask.py, GDAL 3.10 or later).
# Ways and areas carry every tag, as JSON in all_tags; maskrules.py reads them. Nothing is filtered
# early (report_all_tags). Points and relations other than multipolygons aren't read.
#
[general]
# Closed ways with these keys (or key=value) are areas; any closed way with area=yes is too, and
# area=no keeps one a line.
closed_ways_are_polygons=aeroway,amenity,area:highway,building,landuse,leisure,natural,water,waterway=riverbank,highway=platform
report_all_tags=yes
tags_format=json

[points]
osm_id=yes
attributes=
other_tags=no

[lines]
osm_id=yes
attributes=
all_tags=yes
ignore=created_by,converted_by,source,time,note,todo,fixme,FIXME

[multipolygons]
osm_id=yes
attributes=
all_tags=yes
ignore=created_by,converted_by,source,time,note,todo,fixme,FIXME

[multilinestrings]
osm_id=yes
attributes=
other_tags=no

[other_relations]
osm_id=yes
attributes=
other_tags=no
