# The cold drive in the containers that read camera videos (decision A1: the
# owner's OK Oct 8, the drive inside the VM since Oct 10, 2026).
#
# deploy/bin/cold-videos moves each finished camera day older than a week to
# the cold drive and leaves a symlink in its place, pointing at the copy by
# its absolute path. Each container that reads videos mounts the drive
# read-only at that same path, so the links resolve inside it as they do on
# the VM:
#   web                the video library (/videos/), through Caddy
#   cameras, regional  the roll-up and the library's index, which read each
#                      video's size (and a day's CSV when it summarizes one)
# The app and app-next read only cameras/jpeg and cameras/status, and the
# ingest services no videos, so they don't need it.
#
# The drive's mount point is mounted, not a folder on the drive: the mount
# point is there even when the drive isn't (the VM then sees an empty share),
# so the containers always start. The links then lead nowhere, and the
# library says those days aren't available right now.
#
# Enable it, in this order (deploy/README.md, "Older camera videos on the
# cold drive"):
#   1. set COLD_MOUNT in deploy/.env to the drive's mount point: the same
#      value as COLD_MOUNT in /srv/tvt/work/heavy.conf (both stay out of the
#      repo);
#   2. add this file to COMPOSE_FILE in deploy/.env, e.g.
#      COMPOSE_FILE=docker-compose.yml:compose.live-images.yml:compose.cold.yml
#   3. outside the nightly roll-up (00:00-04:00 Boise, and check rolling_up):
#      docker compose up -d --build cameras regional web
#   4. only then switch on the mover's timer.
services:
  web:
    volumes:
      - &cold
        type: bind
        source: ${COLD_MOUNT:?set COLD_MOUNT in deploy/.env (the cold drive's mount point)}
        target: ${COLD_MOUNT:?set COLD_MOUNT in deploy/.env (the cold drive's mount point)}
        read_only: true
        bind:
          create_host_path: false

  cameras:
    volumes:
      - *cold

  regional:
    volumes:
      - *cold
